name: CI

on:
  push:
    branches:
      - 'feature/*'
      - 'bugfix/*'
      - develop
  pull_request:
    branches:
      - develop
      - main
      - 'release/*'
      - 'hotfix/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests
        run: pytest

